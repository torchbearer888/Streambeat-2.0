<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="StreamBeat — a premium offline-first music experience: 10-band EQ, live visualizer, synced lyrics, smart playlists and listening stats. Single-file HTML app.">
<meta name="theme-color" content="#0284c7">
<title>StreamBeat — Premium Music Experience</title>
<style>
/* ============================ TOKENS ============================ */
:root{
  --acc:#0284c7; --acc-rgb:2,132,199;
  --bg:#f0f7ff; --panel:#ffffff; --panel2:#f8fafc; --sidebar:#e6f2fd;
  --card-hover:#f8fafc; --input:#ffffff;
  --glass:rgba(255,255,255,.85);
  --line:rgba(var(--acc-rgb),.14); --line2:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --dim:#94a3b8; --inv:#ffffff;
  --sh-sm:0 2px 8px rgba(var(--acc-rgb),.06);
  --sh-md:0 10px 24px rgba(var(--acc-rgb),.10);
  --sh-lg:0 18px 40px rgba(var(--acc-rgb),.16);
  --sh-modal:0 24px 48px -12px rgba(15,23,42,.28);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.16,1,.3,1); --ease2:cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.dark{
  --bg:#0c1322; --panel:#131e33; --panel2:#0f172a; --sidebar:#0f172a;
  --card-hover:#1a2842; --input:#0b1220;
  --glass:rgba(15,23,42,.88);
  --line:rgba(56,189,248,.13); --line2:#1e293b;
  --text:#f8fafc; --muted:#94a3b8; --dim:#64748b; --inv:#0f172a;
  --sh-sm:0 2px 8px rgba(0,0,0,.30);
  --sh-md:0 10px 26px rgba(0,0,0,.42);
  --sh-lg:0 20px 44px rgba(0,0,0,.55);
  --sh-modal:0 28px 60px rgba(0,0,0,.7);
}
/* ============================ BASE ============================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;transition-property:background-color,color,transform,box-shadow,border-color,opacity;transition-duration:.2s;transition-timing-function:var(--ease2)}
img{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::selection{background:rgba(var(--acc-rgb),.25)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),.25);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--acc-rgb),.45);border:2px solid transparent;background-clip:content-box}
.hidden{display:none!important}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ============================ BUTTONS / CHIPS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(var(--acc-rgb),.30)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(var(--acc-rgb),.38)}
.btn-soft{background:rgba(var(--acc-rgb),.10);color:var(--acc)}
.btn-soft:hover{background:rgba(var(--acc-rgb),.18)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(var(--acc-rgb),.10);color:var(--acc)}
.btn-outline{border:1px solid var(--line2);color:var(--text);background:var(--panel)}
.btn-outline:hover{border-color:var(--acc);color:var(--acc)}
.btn-danger{color:#ef4444;border:1px solid #fca5a5}
.btn-danger:hover{background:#fee2e2}
.dark .btn-danger:hover{background:rgba(239,68,68,.12)}
.icon-btn{width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--text);display:grid;place-items:center;position:relative}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--acc);color:var(--acc);box-shadow:var(--sh-md)}
.icon-btn.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(var(--acc-rgb),.35)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);color:var(--text);padding:8px 15px;border-radius:99px;font-size:12px;font-weight:700;transition-property:background-color,color,border-color,transform,box-shadow;transition-duration:.2s;transition-timing-function:var(--ease2)}
.chip:hover{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-1px);box-shadow:0 6px 16px rgba(var(--acc-rgb),.30)}
.chip.active{background:rgba(var(--acc-rgb),.12);border-color:var(--acc);color:var(--acc)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
/* ============================ AUTH ============================ */
.auth-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:
  radial-gradient(circle at 12% 18%, rgba(var(--acc-rgb),.16), transparent 42%),
  radial-gradient(circle at 88% 82%, rgba(var(--acc-rgb),.12), transparent 42%), var(--bg)}
.auth-box{width:430px;max-width:100%;background:var(--panel);border:1px solid rgba(var(--acc-rgb),.25);border-radius:24px;padding:34px;box-shadow:var(--sh-lg);animation:authIn .5s var(--ease) both}
@keyframes authIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--acc)}
.logo h1 span{opacity:.62}
.logo p{color:var(--muted);font-size:12px;margin-top:6px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel2);border:1px solid var(--line2);padding:5px;border-radius:13px;margin-bottom:22px}
.tabs button{padding:10px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px}
.tabs button.active{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(var(--acc-rgb),.30)}
.form{display:none}
.form.active{display:block;animation:fadeUp .3s var(--ease) both}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--line2);background:var(--input);color:var(--text);outline:none;transition:border-color .2s var(--ease2),box-shadow .2s var(--ease2),background .2s var(--ease2)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.15)}
.strength{display:flex;gap:5px;margin-top:8px}
.strength i{height:4px;flex:1;border-radius:99px;background:var(--line2);transition:background .25s var(--ease2)}
.strength i.f1{background:#ef4444}.strength i.f2{background:#f59e0b}.strength i.f3{background:#22c55e}.strength i.f4{background:var(--acc)}
.auth-msg{min-height:18px;color:#ef4444;font-size:12px;margin-top:12px;text-align:center;font-weight:600}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.1em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line2)}
/* ============================ APP SHELL ============================ */
.app{min-height:100vh}
.sidebar{width:246px;position:fixed;top:0;bottom:0;left:0;background:var(--sidebar);border-right:1px solid var(--line);padding:24px 16px 20px;z-index:30;display:flex;flex-direction:column}
.brand{padding:2px 8px 22px}
.brand h2{font-size:25px;font-weight:800;letter-spacing:-.03em;color:var(--acc)}
.brand h2 span{opacity:.62}
.brand p{color:var(--muted);font-size:10px;margin-top:3px;letter-spacing:.22em;font-weight:700}
.nav{display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:12px;color:var(--muted);text-align:left;padding:11px 14px;border-radius:11px;font-weight:700;font-size:13px;border-left:3px solid transparent}
.nav button:hover{background:rgba(var(--acc-rgb),.10);color:var(--acc)}
.nav button.active{background:rgba(var(--acc-rgb),.13);color:var(--acc);border-left-color:var(--acc)}
.sidebar-bottom{margin-top:auto;padding-top:12px}
.mini-profile{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px;width:100%;text-align:left;transition-property:border-color,box-shadow,transform;transition-duration:.2s;transition-timing-function:var(--ease2)}
.mini-profile:hover{border-color:var(--acc);box-shadow:var(--sh-md);transform:translateY(-2px)}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),rgba(var(--acc-rgb),.55));font-weight:800;color:#fff;font-size:14px}
.mini-profile strong{display:block;font-size:13px;color:var(--text)}
.mini-profile small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.logout{width:100%;margin-top:10px;padding:10px;border-radius:11px;border:1px solid #fca5a5;color:#ef4444;font-weight:700;font-size:13px}
.logout:hover{background:#fee2e2}
.dark .logout:hover{background:rgba(239,68,68,.12)}
.main{margin-left:246px;padding:22px 30px 130px;max-width:1440px}
.top{display:flex;gap:12px;position:sticky;top:0;z-index:20;padding:6px 0 16px;background:linear-gradient(var(--bg) 78%,transparent)}
.search{flex:1;position:relative;max-width:640px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search input{width:100%;padding:12px 16px 12px 44px;border-radius:13px;border:1px solid var(--line2);background:var(--panel);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.15)}
.search-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--sh-lg);padding:10px;z-index:50;max-height:60vh;overflow:auto;animation:fadeUp .22s var(--ease) both}
.sd-group{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 10px 4px}
.sd-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
.sd-item:hover{background:rgba(var(--acc-rgb),.09)}
.sd-item img,.sd-item .sd-ico{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:0 0 34px}
.sd-item .sd-ico{display:grid;place-items:center;background:rgba(var(--acc-rgb),.12);color:var(--acc)}
.top-actions{display:flex;gap:10px;margin-left:auto}
/* ============================ PAGES / SECTIONS ============================ */
.page{display:none}
.page.active{display:block;animation:fadeUp .3s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{position:relative;margin-top:6px;padding:36px;border-radius:22px;overflow:hidden;background:linear-gradient(120deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.05)),var(--panel);border:1px solid rgba(var(--acc-rgb),.30);box-shadow:var(--sh-md)}
.hero::after{content:"";position:absolute;right:-80px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.22),transparent 65%);pointer-events:none}
.hero .kicker{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:8px 0 10px;color:var(--text)}
.hero p{max-width:640px;color:var(--muted);line-height:1.65;font-size:14px}
.hero .hero-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.hero-chips{position:relative;z-index:1;display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.section{margin-top:34px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.section-head .sub{font-size:12px;color:var(--muted);font-weight:600}
.link-btn{color:var(--acc);font-weight:700;font-size:12px}
.link-btn:hover{text-decoration:underline}
/* ============================ CARDS / GRIDS ============================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:18px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:13px;box-shadow:var(--sh-sm);transition-property:transform,box-shadow,border-color;transition-duration:.25s;transition-timing-function:var(--ease);animation:fadeUp .4s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh-md);border-color:rgba(var(--acc-rgb),.55)}
.cover-wrap{position:relative;overflow:hidden;border-radius:12px}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.cover-play{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(var(--acc-rgb),.45);opacity:0;transform:translateY(8px);transition:opacity .2s var(--ease2),transform .2s var(--ease2)}
.card:hover .cover-play,.cover-play:focus-visible{opacity:1;transform:none}
.badge{position:absolute;top:10px;left:10px;background:var(--acc);color:#fff;border-radius:99px;padding:3px 9px;font-size:9px;font-weight:800;letter-spacing:.1em}
.badge.soft{position:static;display:inline-block;background:rgba(var(--acc-rgb),.12);color:var(--acc);margin-top:8px}
.card h4{font-size:14px;font-weight:800;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions .mini{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;padding:8px 6px;background:rgba(var(--acc-rgb),.08);color:var(--text);font-size:11px;font-weight:700;transition:background-color .2s,color .2s}
.card-actions .mini:hover{background:rgba(var(--acc-rgb),.16);color:var(--acc)}
.card-actions .mini.on{background:rgba(239,68,68,.12);color:#ef4444}
.card-actions .mini.primary{background:var(--acc);color:#fff}
.card-actions .mini.primary:hover{filter:brightness(1.08)}
.playing-badge{position:absolute;bottom:10px;left:10px;background:rgba(var(--acc-rgb),.88);padding:6px 9px;border-radius:99px;display:flex;align-items:flex-end;gap:3px;height:26px}
/* soundwave */
.soundwave{display:flex;align-items:flex-end;gap:3px;height:14px}
.soundwave i{display:block;width:3px;background:#fff;border-radius:2px;animation:wave 1s infinite ease-in-out alternate}
.soundwave i:nth-child(2){animation-delay:.25s}.soundwave i:nth-child(3){animation-delay:.5s}
@keyframes wave{0%{height:4px}100%{height:14px}}
/* ============================ ROWS ============================ */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line2);padding:9px 14px;border-radius:13px;transition-property:border-color,background-color,transform;transition-duration:.2s;transition-timing-function:var(--ease2);animation:fadeUp .35s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.row:hover{border-color:rgba(var(--acc-rgb),.5);background:var(--card-hover);transform:translateX(3px)}
.row.current{border-color:var(--acc);background:rgba(var(--acc-rgb),.07)}
.row img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.row .title{font-size:13px;font-weight:800}
.row .sub{font-size:11px;color:var(--muted);margin-top:2px}
.row .row-actions{display:flex;gap:4px;align-items:center}
.row .rbtn{color:var(--muted);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.row .rbtn:hover{color:var(--acc);background:rgba(var(--acc-rgb),.10)}
.row .rbtn.on{color:#ef4444}
.round-play{background:var(--acc)!important;color:#fff!important;width:36px!important;height:36px!important;border-radius:50%!important;display:grid;place-items:center;box-shadow:0 4px 12px rgba(var(--acc-rgb),.35)}
.round-play:hover{transform:scale(1.08)}
.empty{background:var(--panel);border:1.5px dashed var(--line2);border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty .big{font-size:34px;margin-bottom:10px}
.empty b{color:var(--text)}
/* ============================ STATS ============================ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.stat{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:18px;box-shadow:var(--sh-sm)}
.stat .num{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--acc)}
.stat .lbl{color:var(--muted);font-size:11px;margin-top:3px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stat .trend{display:inline-block;background:rgba(34,197,94,.12);color:#16a34a;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:800;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:10px}
.chart .bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.chart .bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--acc),rgba(var(--acc-rgb),.30));border-radius:7px 7px 3px 3px;min-height:4px;transition:height .5s var(--ease);position:relative}
.chart .bar:hover{filter:brightness(1.15)}
.chart .bar-col .x{font-size:9px;color:var(--dim);font-weight:700}
.toplist{display:flex;flex-direction:column;gap:10px}
.tl-row{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:9px 12px;background:var(--panel);border:1px solid var(--line2);border-radius:12px}
.tl-row .pos{font-weight:800;color:var(--dim);font-size:12px}
.tl-row .tl-name{font-size:13px;font-weight:700}
.tl-row .tl-meta{font-size:11px;color:var(--muted);margin-top:2px}
.tl-row .tl-bar{height:5px;border-radius:99px;background:rgba(var(--acc-rgb),.14);margin-top:7px;overflow:hidden}
.tl-row .tl-bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.two-col{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
/* ============================ PLAYER DOCK ============================ */
.player{position:fixed;left:246px;right:0;bottom:0;height:96px;background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:1px solid rgba(var(--acc-rgb),.18);display:grid;grid-template-columns:minmax(210px,1fr) minmax(340px,2fr) minmax(210px,1fr);align-items:center;gap:14px;padding:10px 22px;z-index:40;box-shadow:0 -12px 32px rgba(var(--acc-rgb),.08)}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now-cover-btn{position:relative;width:60px;height:60px;flex:0 0 60px;border-radius:12px;overflow:hidden;box-shadow:var(--sh-sm)}
.now-cover-btn img{width:100%;height:100%;object-fit:cover}
.now-cover-btn .np-open{position:absolute;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .2s}
.now-cover-btn:hover .np-open{opacity:1}
.now-text{min-width:0}
.now-text strong,.now-text span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-text strong{font-size:13px}
.now-text span{font-size:11px;color:var(--muted);margin-top:3px}
.now .fav-btn{color:var(--muted);width:34px;height:34px;display:grid;place-items:center;border-radius:9px}
.now .fav-btn:hover{color:#ef4444}
.now .fav-btn.on{color:#ef4444}
.controls{text-align:center;min-width:0}
.buttons{display:flex;justify-content:center;gap:14px;align-items:center}
.buttons .cbtn{color:var(--muted);width:34px;height:34px;display:grid;place-items:center;border-radius:9px;position:relative}
.buttons .cbtn:hover{color:var(--acc);transform:scale(1.1)}
.buttons .cbtn.on{color:var(--acc)}
.buttons .cbtn.on::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.buttons .main-play{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(var(--acc-rgb),.40);transition:transform .2s var(--ease2),background-color .2s,box-shadow .2s}
.buttons .main-play:hover{transform:scale(1.07)}
.progress{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin-top:7px;font-variant-numeric:tabular-nums}
.seek-wrap{position:relative;display:flex;align-items:center}
.seek-tip{position:absolute;bottom:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.seek-wrap:hover .seek-tip{opacity:1}
.player-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px}
#dockVis{width:64px;height:30px;border-radius:8px;background:rgba(var(--acc-rgb),.07)}
.vol-wrap{display:flex;align-items:center;gap:6px}
/* range inputs */
input[type="range"]{-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,0%) 100% no-repeat rgba(var(--acc-rgb),.18);cursor:pointer;outline-offset:4px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 1px 5px rgba(0,0,0,.30);transition:transform .15s var(--ease2)}
input[type="range"]:hover::-webkit-slider-thumb{transform:scale(1.25)}
input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
input[type="range"].slim{width:86px}
/* ============================ QUEUE DRAWER ============================ */
.queue-panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:var(--sh-lg);z-index:70;transform:translateX(105%);transition:transform .32s var(--ease);display:flex;flex-direction:column}
.queue-panel.open{transform:none}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px}
.q-head h3{font-size:16px;font-weight:800}
.q-body{flex:1;overflow-y:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:6px}
.q-item{display:grid;grid-template-columns:14px 40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 9px;border-radius:11px;border:1px solid transparent}
.q-item:hover{background:var(--card-hover);border-color:var(--line2)}
.q-item.current{background:rgba(var(--acc-rgb),.09);border-color:rgba(var(--acc-rgb),.4)}
.q-item img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.q-item .qi-t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item .qi-s{font-size:10px;color:var(--muted);margin-top:2px}
.q-item .drag-handle{cursor:grab;color:var(--dim)}
.q-item .rbtn{color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.q-item .rbtn:hover{color:#ef4444;background:rgba(239,68,68,.1)}
.q-item.dragging{opacity:.4}
.q-item.drop-target{border-top:2px solid var(--acc)}
/* ============================ NOW PLAYING OVERLAY ============================ */
.np{position:fixed;inset:0;z-index:80;display:none;background:linear-gradient(180deg,rgba(8,14,26,.97),rgba(12,22,40,.98))}
.np.show{display:flex;flex-direction:column;animation:npIn .35s var(--ease) both}
@keyframes npIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
.np-top{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;color:#94a3b8}
.np-top .np-brand{font-size:11px;font-weight:800;letter-spacing:.25em;color:#38bdf8}
.np-main{flex:1;display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:34px;padding:12px 40px;overflow:hidden;min-height:0}
.np-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-width:0}
.np-art{position:relative;width:min(340px,34vw);aspect-ratio:1;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(2,132,199,.35)}
.np-art img{width:100%;height:100%;object-fit:cover}
.np-art::after{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.np-art.spinning img{animation:spinVinyl 22s linear infinite}
@keyframes spinVinyl{to{transform:rotate(360deg)}}
.np-meta{text-align:center;min-width:0;width:100%}
.np-meta h2{color:#f8fafc;font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta p{color:#94a3b8;font-size:13px;margin-top:5px}
.np-ctrl{display:flex;flex-direction:column;gap:8px;width:min(420px,100%);align-items:center}
.np-ctrl .progress{width:100%;grid-template-columns:40px 1fr 40px;color:#94a3b8}
.np-right{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid rgba(255,255,255,.08);padding-left:30px}
.np-tabs{display:flex;gap:8px;margin-bottom:14px}
.np-tabs button{padding:7px 15px;border-radius:99px;font-size:12px;font-weight:700;color:#94a3b8;border:1px solid rgba(255,255,255,.12)}
.np-tabs button.active{background:#38bdf8;color:#06263c;border-color:transparent}
.np-panel{flex:1;overflow-y:auto;min-height:0;padding-right:6px}
.lyrics{display:flex;flex-direction:column;gap:14px;padding:10px 4px 40px}
.lyrics .ly-line{color:#64748b;font-size:17px;font-weight:700;line-height:1.45;transition:color .25s var(--ease2),transform .25s var(--ease);cursor:pointer;transform-origin:left center}
.lyrics .ly-line:hover{color:#94a3b8}
.lyrics .ly-line.current{color:#38bdf8;transform:scale(1.06)}
.lyrics .ly-line.past{color:#475569}
.lyrics.plain .ly-line{cursor:default}
#npVisWrap{position:relative;height:110px;margin:0 0 8px}
#npVis{position:absolute;inset:0;width:100%;height:100%}
.np-actions{display:flex;gap:8px;justify-content:center;padding-bottom:14px}
.np-actions .tbtn{color:#94a3b8;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.10)}
.np-actions .tbtn:hover{color:#38bdf8;border-color:#38bdf8}
/* ============================ MODALS ============================ */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex;animation:fadeIn .2s var(--ease2) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{width:560px;max-width:100%;max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--sh-modal);animation:modalIn .3s var(--ease) both}
.modal-box.wide{width:680px}
@keyframes modalIn{from{opacity:0;transform:translateY(-18px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:20px 22px 0}
.modal-head h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.modal-head .mh-sub{font-size:11px;color:var(--muted);margin-top:3px}
.modal-body{padding:14px 22px 22px;overflow-y:auto}
.modal-head .xbtn,.q-head .xbtn{color:var(--muted);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.modal-head .xbtn:hover,.q-head .xbtn:hover{background:rgba(var(--acc-rgb),.10);color:var(--acc)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2)}
.setting-row:last-child{border-bottom:0}
.setting-row .st-name{font-size:13px;font-weight:700}
.setting-row .st-sub{font-size:11px;color:var(--muted);margin-top:2px}
.swatches{display:flex;gap:9px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;transition:transform .15s var(--ease2),border-color .15s}
.swatch:hover{transform:scale(1.15)}
.swatch.on{border-color:var(--text);transform:scale(1.15)}
.switch{position:relative;width:44px;height:24px;border-radius:99px;background:var(--line2);transition:background-color .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(20px)}
/* EQ */
.eq-wrap{display:flex;gap:14px;justify-content:space-between;padding:10px 4px 2px}
.eq-band{display:flex;flex-direction:column;align-items:center;gap:8px}
.eq-rot{height:120px;width:28px;position:relative}
.eq-rot input{position:absolute;width:120px;left:-46px;top:46.5px;transform:rotate(-90deg)}
.eq-band .hz{font-size:9px;color:var(--muted);font-weight:700}
.eq-band .db{font-size:10px;color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums}
/* upload dropzone */
.dropzone{border:2px dashed rgba(var(--acc-rgb),.4);border-radius:18px;padding:34px 20px;text-align:center;background:rgba(var(--acc-rgb),.04);transition:border-color .2s,background-color .2s;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--acc);background:rgba(var(--acc-rgb),.09)}
.dropzone .dz-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:rgba(var(--acc-rgb),.12);color:var(--acc);display:grid;place-items:center}
.up-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;margin-top:10px;background:var(--panel2)}
.up-item img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.up-item .up-t{font-size:12px;font-weight:700}
.up-item .up-s{font-size:10px;color:var(--muted);margin-top:2px}
.up-item .up-state{margin-left:auto;font-size:10px;font-weight:800;color:var(--acc)}
.up-item.err .up-state{color:#ef4444}
/* share preview */
.share-preview{border-radius:16px;overflow:hidden;box-shadow:var(--sh-md);max-width:100%}
.share-preview canvas{width:100%;display:block}
/* toasts */
.toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:13px;font-size:12.5px;font-weight:700;box-shadow:var(--sh-lg);border:1px solid rgba(var(--acc-rgb),.5);animation:toastIn .3s var(--ease) both;max-width:340px}
.toast.out{animation:toastOut .3s var(--ease2) both}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
/* artist head */
.artist-head{display:flex;gap:22px;align-items:center;background:linear-gradient(120deg,rgba(var(--acc-rgb),.14),rgba(var(--acc-rgb),.04)),var(--panel);padding:24px;border:1px solid rgba(var(--acc-rgb),.3);border-radius:20px}
.artist-avatar{width:96px;height:96px;flex:0 0 96px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--acc);font-size:40px;box-shadow:var(--sh-sm)}
.playlist{min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.playlist .emoji{position:absolute;right:-8px;top:-14px;font-size:88px;opacity:.10}
.playlist .pl-link{font-size:11px;color:var(--acc);margin-top:12px;font-weight:800}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters input,.filters select{padding:9px 14px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);color:var(--text);outline:none;font-size:12.5px}
.filters input:focus,.filters select:focus{border-color:var(--acc)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line2)}
table.data td{padding:10px;border-bottom:1px solid var(--line2)}
table.data tr:hover td{background:var(--card-hover)}
/* ============================ RESPONSIVE ============================ */
@media(max-width:980px){
  .player{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:10px 16px;height:auto}
  .controls{grid-column:1/3;grid-row:2}
  .player-tools{display:none}
  .np-main{grid-template-columns:1fr;overflow-y:auto;padding:6px 22px}
  .np-right{border-left:0;padding-left:0}
}
@media(max-width:720px){
  .sidebar{top:auto;bottom:0;left:0;right:0;width:100%;height:62px;padding:6px 8px;flex-direction:row;align-items:center;border-right:0;border-top:1px solid var(--line);z-index:45}
  .brand,.sidebar-bottom{display:none}
  .nav{flex-direction:row;width:100%;gap:2px}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:9.5px;border-left:0;justify-content:center}
  .nav button.active{border-left:0}
  .main{margin-left:0;padding:14px 14px 200px}
  .player{bottom:62px;border-radius:16px 16px 0 0}
  .hero{padding:24px}
  .hero h1{font-size:25px}
  .top-actions .hide-sm{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- ================= AUTH ================= -->
<section id="authPage" class="auth-page" data-testid="auth-modal">
  <div class="auth-box">
    <div class="logo">
      <h1>Stream<span>Beat</span></h1>
      <p>Your music. Your mood. Your world.</p>
    </div>
    <div class="tabs">
      <button id="loginTab" class="active" data-testid="auth-tab-login">Login</button>
      <button id="signupTab" data-testid="auth-tab-signup">Create Account</button>
    </div>
    <form id="loginForm" class="form active" novalidate>
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" data-testid="login-email-input"></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" data-testid="login-password-input"></div>
      <button class="btn btn-primary" style="width:100%" data-testid="auth-login-submit">Login to StreamBeat</button>
    </form>
    <form id="signupForm" class="form" novalidate>
      <div class="field"><label for="signupName">Full Name</label><input id="signupName" placeholder="Alex Rivera" data-testid="signup-name-input"></div>
      <div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" data-testid="signup-email-input"></div>
      <div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" data-testid="signup-password-input">
        <div class="strength" id="pwStrength"><i></i><i></i><i></i><i></i></div></div>
      <div class="field"><label for="signupConfirm">Confirm Password</label><input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password" data-testid="signup-confirm-input"></div>
      <button class="btn btn-primary" style="width:100%" data-testid="auth-signup-submit">Create My Account</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-soft" style="width:100%" id="demoLoginBtn" data-testid="auth-demo-login-btn">✨ Try the Demo Account</button>
    <p id="authMsg" class="auth-msg"></p>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <h2>Stream<span>Beat</span></h2>
      <p>FEEL THE RHYTHM</p>
    </div>
    <nav class="nav" id="nav" data-testid="sidebar-nav">
      <button class="active" data-page="home" data-testid="nav-home"><span data-icon="home"></span>Home</button>
      <button data-page="browse" data-testid="nav-browse"><span data-icon="compass"></span>Browse</button>
      <button data-page="library" data-testid="nav-library"><span data-icon="library"></span>Library</button>
      <button data-page="playlists" data-testid="nav-playlists"><span data-icon="playlist"></span>Playlists</button>
      <button data-page="favorites" data-testid="nav-favorites"><span data-icon="heart"></span>Favorites</button>
      <button data-page="artists" data-testid="nav-artists"><span data-icon="mic"></span>Artists</button>
      <button data-page="stats" data-testid="nav-stats"><span data-icon="chart"></span>Stats</button>
      <button data-page="admin" data-testid="nav-admin"><span data-icon="sliders"></span>Admin</button>
    </nav>
    <div class="sidebar-bottom">
      <button class="mini-profile" id="miniProfile" data-testid="mini-profile-btn" title="Open profile">
        <span class="avatar" id="smallAvatar">U</span>
        <span><strong id="smallName">User</strong><small id="smallEmail">email</small></span>
      </button>
      <button id="logoutBtn" class="logout" data-testid="logout-btn">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="search">
        <span data-icon="search" data-icon-size="17"></span>
        <input id="searchInput" placeholder="Search songs, artists, albums, genres…  ( / )" autocomplete="off" data-testid="global-search-input" aria-label="Search music">
        <div id="searchDrop" class="search-drop hidden"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="uploadBtn" title="Add your own songs" data-testid="upload-open-btn" aria-label="Add your own songs"><span data-icon="upload"></span></button>
        <button class="icon-btn" id="themeBtn" title="Toggle dark mode" data-testid="theme-toggle-btn" aria-label="Toggle dark mode"><span data-icon="moon"></span></button>
        <button class="icon-btn hide-sm" id="notifyBtn" title="Notifications" data-testid="notify-btn" aria-label="Notifications"><span data-icon="bell"></span></button>
        <button class="icon-btn" id="settingsBtn" title="Settings" data-testid="settings-open-btn" aria-label="Settings"><span data-icon="gear"></span></button>
      </div>
    </header>
    <section id="page-home" class="page active" data-page="home"></section>
    <section id="page-browse" class="page" data-page="browse"></section>
    <section id="page-library" class="page" data-page="library"></section>
    <section id="page-playlists" class="page" data-page="playlists"></section>
    <section id="page-favorites" class="page" data-page="favorites"></section>
    <section id="page-artists" class="page" data-page="artists"></section>
    <section id="page-stats" class="page" data-page="stats"></section>
    <section id="page-admin" class="page" data-page="admin"></section>
    <section id="page-profile" class="page" data-page="profile"></section>
  </main>

  <footer class="player" id="playerDock" data-testid="player-dock">
    <div class="now">
      <button class="now-cover-btn" id="npExpand" data-testid="player-now-playing-expand" aria-label="Open now playing view">
        <img id="playerCover" alt="Now playing cover">
        <span class="np-open"><span data-icon="expand"></span></span>
      </button>
      <div class="now-text">
        <strong id="playerTitle">Select a song</strong>
        <span id="playerArtist">StreamBeat · your music lives here</span>
      </div>
      <button class="fav-btn" id="playerFav" data-testid="player-fav-btn" aria-label="Favorite current song"><span data-icon="heart"></span></button>
    </div>
    <div class="controls">
      <div class="buttons">
        <button class="cbtn" id="shuffleBtn" data-testid="player-shuffle-btn" title="Shuffle (S)" aria-label="Shuffle"><span data-icon="shuffle"></span></button>
        <button class="cbtn" id="prevBtn" data-testid="player-prev-btn" title="Previous (P)" aria-label="Previous"><span data-icon="prev"></span></button>
        <button class="main-play" id="playBtn" data-testid="player-play-pause-btn" title="Play/Pause (Space)" aria-label="Play or pause"><span id="playIcon" data-icon="play"></span></button>
        <button class="cbtn" id="nextBtn" data-testid="player-next-btn" title="Next (N)" aria-label="Next"><span data-icon="next"></span></button>
        <button class="cbtn" id="repeatBtn" data-testid="player-repeat-btn" title="Repeat (R)" aria-label="Repeat"><span id="repeatIcon" data-icon="repeat"></span></button>
      </div>
      <div class="progress">
        <span id="currentTime">0:00</span>
        <div class="seek-wrap">
          <input id="progressBar" type="range" min="0" max="1000" value="0" data-testid="player-progress-bar" aria-label="Seek">
          <div class="seek-tip" id="seekTip">0:00</div>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-tools">
      <canvas id="dockVis" width="128" height="60" data-testid="dock-visualizer" title="Live audio" aria-label="Live audio visualizer"></canvas>
      <button class="icon-btn sm" id="sleepBtn" title="Sleep timer" data-testid="sleep-timer-btn" aria-label="Sleep timer"><span data-icon="timer"></span></button>
      <button class="icon-btn sm" id="speedBtn" title="Playback speed" data-testid="speed-btn" aria-label="Playback speed"><span data-icon="gauge"></span></button>
      <button class="icon-btn sm" id="eqBtn" title="Equalizer (E)" data-testid="eq-open-btn" aria-label="Equalizer"><span data-icon="eq"></span></button>

/* ---------------- IndexedDB (blobs: uploads + rendered demo audio) ---------------- */
let idb = null;
function idbOpen(){
  return new Promise((res, rej) => {
    if(idb) return res(idb);
    const rq = indexedDB.open('StreamBeatMusicDB', 2);
    rq.onupgradeneeded = () => { const d = rq.result; if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); };
    rq.onsuccess = () => { idb = rq.result; res(idb); };
    rq.onerror = () => rej(rq.error);
  });
}
const idbTx = async (mode, fn) => {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction('blobs', mode);
    const out = fn(tx.objectStore('blobs'));
    tx.oncomplete = () => res(out ? out.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
};
const blobPut = (k, b) => idbTx('readwrite', s => s.put(b, k));
const blobGet = k => idbTx('readonly', s => s.get(k));
const blobDel = k => idbTx('readwrite', s => s.delete(k));

/* ---------------- WAV encoder (for synthesized demo tracks) ---------------- */
function bufferToWav(buf){
  const ch = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length;
  const data = buf.getChannelData(0);
  const bytes = len * ch * 2;
  const ab = new ArrayBuffer(44 + bytes), dv = new DataView(ab);
  const wstr = (o, s) => { for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  wstr(0,'RIFF'); dv.setUint32(4, 36+bytes, true); wstr(8,'WAVE'); wstr(12,'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr*ch*2, true); dv.setUint16(32, ch*2, true);
  dv.setUint16(34, 16, true); wstr(36,'data'); dv.setUint32(40, bytes, true);
  let o = 44;
  for(let i=0;i<len;i++){ const v = clamp(data[i], -1, 1); dv.setInt16(o, v<0 ? v*32768 : v*32767, true); o += 2; }
  return new Blob([ab], { type:'audio/wav' });
}

/* ---------------- procedural music synthesizer (offline demo audio) ---------------- */
const SCALE_MIN = [0,2,3,5,7,8,10], SCALE_MAJ = [0,2,4,5,7,9,11];
const midiF = n => 440 * Math.pow(2, (n-69)/12);
function synthTrack(cfg){
  const SR = 24000, dur = cfg.dur, ctx = new OfflineAudioContext(1, Math.ceil(SR*dur), SR);
  const rng = mulberry32(cfg.seed);
  const beat = 60 / cfg.bpm, bar = beat*4;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 7; comp.attack.value = .006; comp.release.value = .24;
  const master = ctx.createGain(); master.gain.value = .86;
  master.connect(comp); comp.connect(ctx.destination);
  const noiseBuf = ctx.createBuffer(1, SR, SR);
  const nd = noiseBuf.getChannelData(0);
  for(let i=0;i<SR;i++) nd[i] = Math.random()*2-1;
  const noise = () => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s; };
  const env = (g, t, a, d, peak) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(.0001, t+a+d); };
  const kick = (t, v) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(44, t+.12); env(g, t, .003, .20, v); o.connect(g); g.connect(master); o.start(t); o.stop(t+.25); };
  const snare = (t, v) => { const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type='highpass'; f.frequency.value = 1600; env(g, t, .002, .16, v); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+.2); };
  const hat = (t, v, open) => { const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type='highpass'; f.frequency.value = 6800; env(g, t, .001, open ? .28 : .05, v); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+(open?.32:.08)); };
  const tone = (t, freq, len, type, vol, filt, dest) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.02); g.gain.setTargetAtTime(0, t+len*.7, len*.16); g.gain.linearRampToValueAtTime(0, t+len+.06);
    if(filt){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = filt; f.Q.value = .8; o.connect(f); f.connect(g); } else o.connect(g);
    g.connect(dest || master); o.start(t); o.stop(t+len+.12);
  };
  const pluck = (t, freq, len, vol, wet) => { tone(t, freq, len, 'square', vol, 2400); if(wet){ tone(t+wet, freq, len*.8, 'square', vol*.34, 2000); } };
  const vib = (t, freq, len, vol, filt) => { const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type='triangle'; o.frequency.value = freq; lfo.frequency.value = 5.2; lg.gain.value = freq*.006; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.06); g.gain.setTargetAtTime(0, t+len*.6, len*.2); g.gain.linearRampToValueAtTime(0, t+len+.1);
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = filt||1600;
    o.connect(f); f.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t+len+.15); lfo.stop(t+len+.15); };
  const crackle = () => { const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type='bandpass'; f.frequency.value = 4200; f.Q.value = .6; g.gain.value = .012; s.connect(f); f.connect(g); g.connect(master); s.start(0); s.stop(dur); };
  const roots = cfg.roots, scale = cfg.mode === 'maj' ? SCALE_MAJ : SCALE_MIN;
  const chordOf = root => { const i = scale.indexOf(((root%12)+12)%12 % 12) ; const deg = [root, root+scale[(i+2)%7] , root+scale[(i+4)%7]]; return deg; };
  const bars = Math.floor(dur / bar) - 1;
  if(cfg.genre === 'Lo-Fi') crackle();

/* ---------------- ID3v2 tag parser (title/artist/album/genre/cover) ---------------- */
function parseID3(buf){
  const u8 = new Uint8Array(buf);
  if(u8.length < 10 || u8[0] !== 0x49 || u8[1] !== 0x44 || u8[2] !== 0x33) return null;
  const ver = u8[3];
  const sz = (u8[6]&0x7f)<<21 | (u8[7]&0x7f)<<14 | (u8[8]&0x7f)<<7 | (u8[9]&0x7f);
  const end = Math.min(10 + sz, u8.length);
  let p = 10, out = {};
  const td = (bytes, enc) => {
    try{
      if(enc === 1 || enc === 2){ const le = enc === 1; let s = ''; for(let i=0;i+1<bytes.length;i+=2) s += String.fromCharCode(bytes[i] | (bytes[i+1]<<8)); return s.replace(/\u0000+$/g,'').replace(/^\uFEFF/,''); }
      return new TextDecoder(enc === 3 ? 'utf-8' : 'iso-8859-1').decode(bytes).replace(/\u0000+$/g,'');
    }catch(e){ return ''; }
  };
  while(p + 10 <= end){
    const id = String.fromCharCode(u8[p], u8[p+1], u8[p+2], u8[p+3]);
    if(!/^[A-Z0-9]{4}$/.test(id)) break;
    let fsz;
    if(ver === 4) fsz = (u8[p+4]&0x7f)<<21 | (u8[p+5]&0x7f)<<14 | (u8[p+6]&0x7f)<<7 | (u8[p+7]&0x7f);
    else fsz = (u8[p+4]<<24 | u8[p+5]<<16 | u8[p+6]<<8 | u8[p+7]) >>> 0;
    if(fsz <= 0 || p + 10 + fsz > end) break;
    const body = u8.subarray(p+10, p+10+fsz);
    if(id === 'TIT2' || id === 'TT2') out.title = td(body.subarray(1), body[0]);
    else if(id === 'TPE1' || id === 'TP1') out.artist = td(body.subarray(1), body[0]);
    else if(id === 'TALB' || id === 'TAL') out.album = td(body.subarray(1), body[0]);
    else if(id === 'TCON' || id === 'TCO') out.genre = td(body.subarray(1), body[0]).replace(/^\((\d+)\)\s*/, '');
    else if(id === 'APIC' || id === 'PIC'){
      const enc = body[0]; let q = 1, mime = 'image/jpeg';
      if(id === 'APIC'){ let e2 = q; while(e2 < body.length && body[e2] !== 0) e2++; mime = new TextDecoder('iso-8859-1').decode(body.subarray(q, e2)) || 'image/jpeg'; q = e2 + 1; }
      else { q = 4; mime = 'image/' + String.fromCharCode(body[1], body[2], body[3]).toLowerCase(); }
      q += 1; // picture type
      if(enc === 1 || enc === 2){ while(q+1 < body.length && !(body[q] === 0 && body[q+1] === 0)) q += 2; q += 2; }
      else { while(q < body.length && body[q] !== 0) q++; q += 1; }
      if(q < body.length) out.pic = new Blob([body.slice(q)], { type: mime });
    }
    p += 10 + fsz;
  }
  return out;
}

function genCover(title, artist){
  const c = document.createElement('canvas'); c.width = 300; c.height = 300;
  const x = c.getContext('2d'), r = mulberry32(hashStr(title + artist));
  const h1 = Math.floor(r()*360), h2 = (h1 + 30 + Math.floor(r()*70)) % 360;
  const g = x.createLinearGradient(0, 0, 300, 300);
  g.addColorStop(0, 'hsl('+h1+',72%,58%)'); g.addColorStop(1, 'hsl('+h2+',70%,32%)');
  x.fillStyle = g; x.fillRect(0,0,300,300);
  const rg = x.createRadialGradient(70, 70, 10, 70, 70, 220);
  rg.addColorStop(0, 'rgba(255,255,255,.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = rg; x.fillRect(0,0,300,300);
  x.fillStyle = 'rgba(255,255,255,.28)';
  for(let i=0;i<5;i++){ const bx = 40 + i*46, bh = 26 + r()*92; x.fillRect(bx, 258-bh, 18, bh); }
  x.fillStyle = 'rgba(255,255,255,.92)'; x.font = '800 118px '+getComputedStyle(document.body).fontFamily;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(initials(title || '♪'), 150, 138);
  return c.toDataURL('image/png');
}

  b.classList.toggle('on', !!(S.sleepAt || S.sleepMode === 'track'));
  b.title = S.sleepMode === 'track' ? 'Sleep timer: end of track' : (S.sleepAt ? 'Sleep timer: ' + left + ' min left' : 'Sleep timer');
}
/* ---------------- stats tracking ---------------- */
function trackTick(){
  if(!S.data || !A.el || A.el.paused || !S.session) return;
  const dt = A.el.currentTime - S.session.lastT;
  if(dt > 0 && dt < 2){
    const st = S.data.stats, tk = todayKey();
    st.days[tk] = st.days[tk] || { sec: 0, plays: 0 };
    st.days[tk].sec += dt; st.totalSec += dt;
    S.statsDirty = true;
  }
  S.session.lastT = A.el.currentTime;
  if(!S.session.counted && (A.el.currentTime > 15 || (A.el.duration && A.el.currentTime >= A.el.duration - .5))){
    S.session.counted = true;
    const song = getSong(S.session.id);
    if(song){
      const st = S.data.stats, tk = todayKey();
      st.days[tk] = st.days[tk] || { sec: 0, plays: 0 };
      st.days[tk].plays++;
      st.songs[song.id] = st.songs[song.id] || { plays: 0, sec: 0 };
      st.songs[song.id].plays++;
      st.artists[song.artist] = st.artists[song.artist] || { plays: 0, sec: 0 };
      st.artists[song.artist].plays++;
      if(song.genre){ st.genres[song.genre] = st.genres[song.genre] || { plays: 0, sec: 0 }; st.genres[song.genre].plays++; }
      st.totalPlays++;
      S.statsDirty = true;
    }
  }
}
function flushStats(){ if(S.statsDirty){ saveData(); S.statsDirty = false; } }
setInterval(() => { if(S.statsDirty) flushStats(); }, 5000);
window.addEventListener('pagehide', flushStats);

/* ---------------- visualizer ---------------- */
const freqData = new Uint8Array(256);
let visRAF = null;
function visActive(){ return (A.el && !A.el.paused && S.currentId) || $('np').classList.contains('show'); }
function drawVis(){
  visRAF = null;
  if(!visActive()){ drawDockIdle(); return; }
  if(A.ready){
    const n = A.analyser.frequencyBinCount;
    if(freqData.length !== n) freqData.length = n;
    A.analyser.getByteFrequencyData(freqData);
  }
  const dv = $('dockVis'), dc = dv && dv.getContext('2d');
  if(dc){
    dc.clearRect(0, 0, dv.width, dv.height);
    const bars = 22, gap = 2, bw = (dv.width - gap * (bars - 1)) / bars;
    for(let i = 0; i < bars; i++){
      const v = A.ready ? freqData[Math.floor(Math.pow(i / bars, 1.4) * 100) + 2] / 255 : 0;
      const h = Math.max(3, v * dv.height);
      dc.fillStyle = 'rgba(' + getComputedStyle(document.documentElement).getPropertyValue('--acc-rgb') + ',' + (.45 + v * .55) + ')';
      dc.fillRect(i * (bw + gap), dv.height - h, bw, h);
    }
  }
  const nv = $('np'), nvc = $('npVis');
  if(nv.classList.contains('show') && nvc){
    const dpr = window.devicePixelRatio || 1;
    const w = nvc.clientWidth * dpr, h = nvc.clientHeight * dpr;
    if(nvc.width !== w || nvc.height !== h){ nvc.width = w; nvc.height = h; }
    const c = nvc.getContext('2d');
    c.clearRect(0, 0, w, h);
    const rgb = getComputedStyle(document.documentElement).getPropertyValue('--acc-rgb').trim();
    const mode = S.visMode;
    if(mode === 'bars'){
      const bars = 48, bw = w / bars, g = c.createLinearGradient(0, h, 0, 0);
      g.addColorStop(0, 'rgba(' + rgb + ',.35)'); g.addColorStop(1, 'rgba(56,189,248,.95)');
      c.fillStyle = g;
      for(let i = 0; i < bars; i++){
        const v = A.ready ? freqData[Math.floor(Math.pow(i / bars, 1.35) * 110) + 2] / 255 : 0;
        const bh = Math.max(2 * dpr, v * h * .92);
        c.fillRect(i * bw + bw * .18, h - bh, bw * .64, bh);
        c.fillStyle = 'rgba(255,255,255,.75)';
        c.fillRect(i * bw + bw * .18, h - bh - 2 * dpr, bw * .64, 2 * dpr);
        c.fillStyle = g;
      }
    } else if(mode === 'wave'){
      const td = new Uint8Array(A.ready ? A.analyser.fftSize : 128);
      if(A.ready) A.analyser.getByteTimeDomainData(td);
      c.beginPath(); c.strokeStyle = 'rgba(56,189,248,.9)'; c.lineWidth = 2 * dpr;
      for(let i = 0; i < td.length; i++){
        const x = i / td.length * w, y = h / 2 + (td[i] - 128) / 128 * h * .48;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    } else {
      const cx = w / 2, cy = h / 2 + h * .06, base = Math.min(w, h) * .30, spokes = 64;
      c.save(); c.translate(cx, cy);
      for(let i = 0; i < spokes; i++){
        const v = A.ready ? freqData[Math.floor(i / spokes * 120) + 2] / 255 : 0;
        const a = i / spokes * Math.PI * 2, len = base + v * h * .52;
        c.strokeStyle = 'rgba(' + rgb + ',' + (.35 + v * .6) + ')';
        c.lineWidth = 2.4 * dpr; c.lineCap = 'round';
        c.beginPath(); c.moveTo(Math.cos(a) * base, Math.sin(a) * base); c.lineTo(Math.cos(a) * len, Math.sin(a) * len); c.stroke();
      }
      c.restore();
    }
  }
  visRAF = requestAnimationFrame(drawVis);
}
function drawDockIdle(){
  const dv = $('dockVis'), dc = dv && dv.getContext('2d');
  if(dc){ dc.clearRect(0, 0, dv.width, dv.height); }
}
function kickVis(){ if(!visRAF) visRAF = requestAnimationFrame(drawVis); }

/* ---------------- media session ---------------- */
function updateMediaSession(song){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title, artist: song.artist, album: song.album || 'StreamBeat',
      artwork: [{ src: coverOf(song), sizes: '300x300', type: 'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', () => nextSong(true));
    navigator.mediaSession.setActionHandler('seekto', d => { if(A.el && d.seekTime != null) A.el.currentTime = d.seekTime; });
  }catch(e){}
}

/* ---------------- audio element events ---------------- */
function wireAudio(){
  A.el = new Audio();
  A.el.preload = 'auto';
  A.el.volume = S.set.volume;
  A.el.addEventListener('play', () => { updatePlayerUI(); kickVis(); });
  A.el.addEventListener('pause', () => { updatePlayerUI(); flushStats(); });
  A.el.addEventListener('ended', () => {
    flushStats();
    if(S.sleepMode === 'track'){ S.sleepMode = null; updateSleepBtn(); updatePlayerUI(); toast('Sleep timer — stopped after this track'); return; }
    nextSong(false);
  });
  A.el.addEventListener('timeupdate', () => {
    trackTick();
    const d = A.el.duration || 0, cur = A.el.currentTime || 0;
    const pb = $('progressBar'), np = $('npProgress');
    if(d && !seekDragging){ pb.value = Math.round(cur / d * 1000); paintRange(pb); }
    if(d && !seekDragging){ np.value = Math.round(cur / d * 1000); paintRange(np); }
    $('currentTime').textContent = fmtTime(cur);
    $('npCur').textContent = fmtTime(cur);
    $('duration').textContent = fmtTime(d);
    $('npDur').textContent = fmtTime(d);
    syncLyricCursor(cur);
    if(S.set.xfade && d && d - cur <= S.set.xsec + .1 && !A.fading && S.repeat !== 2 && A.el && !A.el.paused && S.queue.length > 1){
      const n = S.qIndex + 1 < S.queue.length || S.repeat === 1;
      if(n) fadeOutAndNext();
    }
  });
  A.el.addEventListener('loadedmetadata', () => {
    const song = songOfCurrent();
    if(song && song.custom && song.dur !== Math.round(A.el.duration)){ song.dur = Math.round(A.el.duration); saveData(); renderAll(); }
  });
  A.el.addEventListener('error', () => {
    if(!S.currentId) return;
    A.errCount = (A.errCount || 0) + 1;
    if(A.errCount < 3){ toast('Track failed — skipping', 'err'); nextSong(true); }
  });
}

let dragIdx = null;
function wireQueueDnd(){
  $$('#queueList .q-item').forEach(item => {
    item.addEventListener('dragstart', e => { dragIdx = Number(item.dataset.idx); item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); $$('.q-item').forEach(q => q.classList.remove('drop-target')); });
    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drop-target'); });
    item.addEventListener('dragleave', () => item.classList.remove('drop-target'));
    item.addEventListener('drop', e => { e.preventDefault(); item.classList.remove('drop-target'); if(dragIdx != null) queue.reorder(dragIdx, Number(item.dataset.idx)); dragIdx = null; });
  });
}

/* ---------------- lyrics ---------------- */
function parseLRC(text){
  const out = [];
  String(text || '').split('\n').forEach(line => {
    const m = line.match(/^\s*\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    if(m) out.push({ t: parseInt(m[1], 10) * 60 + parseFloat(m[2]), text: m[3] });
  });
  return out.length ? out.sort((a, b) => a.t - b.t) : null;
}

    body.classList.add('plain');

  }
  lyricIdx = -1;
  if(lrc){
    body.innerHTML = '<div class="lyrics">' + lrc.map((l, i) => '<div class="ly-line" data-t="' + l.t + '" data-li="' + i + '">' + esc(l.text || '·') + '</div>').join('') + '</div>';
    $$('#npPanelBody .ly-line').forEach(el => el.addEventListener('click', () => { if(A.el) A.el.currentTime = Number(el.dataset.t); }));

    body.innerHTML = '<div class="lyrics plain">' + S.data.lyrics[song.id].split('\n').map(l => '<div class="ly-line">' + (esc(l) || '&nbsp;') + '</div>').join('') + '</div>';

function syncLyricCursor(cur){
  if(S.npTab !== 'lyrics' || !$('np').classList.contains('show')) return;
  const song = songOfCurrent(); if(!song) return;
  const lrc = parseLRC(S.data.lyrics[song.id]); if(!lrc) return;
  let idx = 0; for(let i = 0; i < lrc.length; i++){ if(lrc[i].t <= cur) idx = i; }
  if(idx === lyricIdx) return;
  lyricIdx = idx;
  const lines = $$('#npPanelBody .ly-line');
  lines.forEach((el, i) => { el.classList.toggle('current', i === idx); el.classList.toggle('past', i < idx); });
  if(lines[idx]) lines[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
}

let modalOnClose = null;
function openModal(title, bodyHTML, opts){

  $('modalBox').classList.toggle('wide', !!opts.wide);

function closeModal(){ $('modal').classList.remove('show'); const f = modalOnClose; modalOnClose = null; if(f) f(); }

/* upload */
const staged = [];
async function probeAudio(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file), a = new Audio();
    a.onloadedmetadata = () => { res(Math.round(a.duration) || 0); URL.revokeObjectURL(url); };
    a.onerror = () => res(0);
    a.src = url;
  });
}
async function handleFiles(files){
  const box = $('upList'); if(!box) return;
  for(const file of files){
    if(!file.type.startsWith('audio') && !/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(file.name)){ addUpRow(box, file.name, 'skipped (not audio)', true); continue; }
    if(file.size > 80 * 1024 * 1024){ addUpRow(box, file.name, 'too large (max 80 MB)', true); continue; }
    const row = addUpRow(box, file.name, 'reading tags…');
    try{
      let meta = {};
      if(/\.mp3$/i.test(file.name)){ try{ meta = parseID3(await file.slice(0, 512 * 1024).arrayBuffer()) || {}; }catch(e){} }
      const dur = await probeAudio(file);
      const id = uid(), audioKey = 'audio-' + id, coverKey = 'cover-' + id;
      await blobPut(audioKey, file);
      let cover = null;
      if(meta.pic instanceof Blob){ await blobPut(coverKey, meta.pic); cover = coverKey; }
      else if(file.__coverBlob){ await blobPut(coverKey, file.__coverBlob); cover = coverKey; }
      const fTitle = meta.title || titleFromFile(file.name);
      const song = { id, title: fTitle, artist: meta.artist || 'Unknown Artist', album: meta.album || '', genre: meta.genre || 'Other', dur: dur || 30, audioKey, coverKey: cover, custom: true, added: Date.now() };
      if(cover) S.objUrls[coverKey] = URL.createObjectURL(await blobGet(coverKey));
      S.data.uploads.push(song); saveData();
      row.remove(); addUpRow(box, fTitle + ' — ' + song.artist, '✓ added · ' + fmtTime(song.dur), false, coverOf(song));
      renderAll();
    }catch(e){ row.remove(); addUpRow(box, file.name, 'failed to read', true); }
  }
  toast('Upload complete 🎵', 'ok');
}
function addUpRow(box, title, state, err, cover){
  const d = document.createElement('div');
  d.className = 'up-item' + (err ? ' err' : '');
  d.innerHTML = (cover ? '<img src="' + cover + '">' : '') + '<div><div class="up-t nowrap">' + esc(title) + '</div><div class="up-s">' + esc(state) + '</div></div><span class="up-state">' + (err ? '✕' : '') + '</span>';
  box.appendChild(d); return d;
}

/* export / import */
async function exportData(){
  const payload = { v: 2, exported: new Date().toISOString(), users: getUsers(), settings: getSettings(), data: {} };
  Object.keys(getUsers()).forEach(e => { payload.data[e] = store.get(dataKey(e), null); });
  const blobs = {};
  const keys = [];
  S.data.uploads.forEach(u => { keys.push(u.audioKey, u.coverKey); });
  let total = 0;
  for(const k of keys){ if(!k) continue; const b = await blobGet(k); if(b instanceof Blob){ if(total + b.size < 40 * 1024 * 1024){ blobs[k] = { type: b.type, b64: btoa(await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(b); })) }; total += b.size; } } }
  payload.blobs = blobs;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload)], { type: 'application/json' }));
  a.download = 'streambeat-backup-' + todayKey() + '.json'; a.click();
  toast('Backup exported ⬇', 'ok');
}
function importData(file){
  const fr = new FileReader();
  fr.onload = async () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.v !== 2 || !p.users) throw new Error('bad file');
      if(!(await confirmModal('Restore this backup? It will replace all accounts and data on this device.'))) return;
      saveUsers(p.users); store.set('sb_settings', p.settings || getSettings());
      Object.entries(p.data || {}).forEach(([e, d]) => { if(d) store.set(dataKey(e), d); });
      for(const [k, v] of Object.entries(p.blobs || {})){
        const bin = atob(v.b64), arr = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        await blobPut(k, new Blob([arr], { type: v.type }));
      }
      toast('Backup restored ✓ — reloading', 'ok');
      setTimeout(() => location.reload(), 900);
    }catch(e){ toast('Invalid backup file', 'err'); }
  };
  fr.readAsText(file);
}
