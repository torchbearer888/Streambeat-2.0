document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset;
  switch(a.action){
    case 'play': if(a.id) playSong(a.id); break;
    case 'playall': { const ids = (a.ids || '').split(',').filter(Boolean); if(!ids.length){ toast('No tracks in this mix yet'); break; } S.queue = ids; S.qIndex = 0; playSong(ids[0], { fadeIn: false }); break; }
    case 'fav': { const id = a.id, i = S.data.favorites.indexOf(id); if(i >= 0){ S.data.favorites.splice(i, 1); toast('Removed from favorites'); } else { S.data.favorites.push(id); toast('Added to favorites ❤️', 'ok'); } saveData(); renderAll(); break; }
    case 'save': { const id = a.id, i = S.data.saved.indexOf(id); if(i >= 0){ S.data.saved.splice(i, 1); toast('Removed from library'); } else { S.data.saved.push(id); toast('Saved to library ⬇', 'ok'); } saveData(); renderAll(); break; }
    case 'follow': { const ar = a.artist, i = S.data.following.indexOf(ar); if(i >= 0){ S.data.following.splice(i, 1); toast('Unfollowed ' + ar); } else { S.data.following.push(ar); toast('Following ' + ar + ' 🎤', 'ok'); } saveData(); renderAll(); break; }
    case 'artist': S.artistView = a.artist; go('artists'); break;
    case 'genre': S.browse = { q: '', genre: a.genre, sort: 'title' }; go('browse'); break;
    case 'go': go(a.page); break;
    case 'pl-open': openPlaylist(a.id); break;
    case 'pl-create': promptModal('New playlist name', '').then(n => { if(n){ S.data.playlists.push({ id: Date.now(), name: n, desc: 'Custom StreamBeat playlist', icon: PL_ICONS[Math.floor(Math.random() * PL_ICONS.length)], songs: [] }); saveData(); renderAll(); toast('Playlist created ✓', 'ok'); } }); break;
    case 'pl-remove': { const p = S.data.playlists.find(x => String(x.id) === String(a.pl)); if(p){ p.songs = p.songs.filter(x => x !== a.id); saveData(); openPlaylist(a.pl); renderAll(); } break; }
    case 'addto': openAddTo(a.id); break;
    case 'share': shareCard(a.id); break;
    case 'lyrics-edit': openLyrics(a.id); break;
    case 'q-play': { const i = Number(a.idx); S.qIndex = i; playSong(S.queue[i]); break; }
    case 'q-remove': queue.remove(Number(a.idx)); if(S.npTab === 'queue') renderNpPanel(); break;
    case 'queue-next': queue.playNext(a.id); break;
    case 'upload-open': openUpload(); break;
    case 'upload-del': confirmUploadDelete(a.id); break;
    case 'theme': setTheme(S.set.theme === 'dark' ? 'light' : 'dark'); break;
    case 'settings-open': openSettings(); break;
    case 'shortcuts': openShortcuts(); break;
    case 'export': exportData(); break;
    case 'import': { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json'; inp.onchange = () => inp.files[0] && importData(inp.files[0]); inp.click(); break; }
    case 'prewarm': toast('Rendering demo tracks… ⚡'); prewarmDemoAudio(DEMO.map(s => s.id)).then(() => toast('Demo library rendered ✓', 'ok')); break;
    case 'reset-user': confirmResetUser(); break;
    case 'edit-profile': promptModal('Your display name', S.user.name).then(n => { if(n){ const us = getUsers(); us[S.user.email].name = n; saveUsers(us); S.user = us[S.user.email]; $('smallName').textContent = n; $('smallAvatar').textContent = initials(n); saveData(); renderAll(); toast('Profile updated ✓', 'ok'); } }); break;
    case 'clear-history': S.data.recent = []; saveData(); renderAll(); toast('History cleared'); break;
    case 'demo-login': demoLogin(); break;
  }
});
async function confirmUploadDelete(id){
  const song = S.data.uploads.find(x => x.id === id); if(!song) return;
  if(await confirmModal('Delete "' + song.title + '" from your library?')){
    if(song.audioKey) blobDel(song.audioKey);
    if(song.coverKey) blobDel(song.coverKey);
    S.data.uploads = S.data.uploads.filter(x => x.id !== id);
    S.data.favorites = S.data.favorites.filter(x => x !== id);
    S.data.saved = S.data.saved.filter(x => x !== id);
    saveData();
    if(S.currentId === id){ A.el.pause(); S.currentId = null; }
    renderAll(); toast('Upload deleted');
  }
}
async function confirmResetUser(){
  if(await confirmModal('Reset favorites, playlists, history and stats? This cannot be undone.')){
    S.data = defaultData(); S.data.playlists = defaultPlaylistsFor();
    store.set(dataKey(S.user.email), S.data);
    renderAll(); toast('Data reset');
  }
}
function defaultPlaylistsFor(){
  return [
    { id: 101, name: 'Workout Boost', desc: 'High-energy tracks to keep you moving.', icon: '💪', songs: ['d2', 'd6', 'd11', 'd4'] },
    { id: 102, name: 'Chill Evenings', desc: 'Relaxing tracks for peaceful nights.', icon: '🌙', songs: ['d8', 'd14', 'd3', 'd10'] },
    { id: 103, name: 'Focus Flow', desc: 'Music for deep concentration.', icon: '🎧', songs: ['d3', 'd5', 'd12'] },
    { id: 104, name: 'Road Trip Mix', desc: 'Perfect songs for long drives.', icon: '🚗', songs: ['d5', 'd9', 'd13', 'd1'] }
  ];
}
/* ---------------- auth ---------------- */
function seedDemo(){
  const users = getUsers();
  if(!users['demo@streambeat.app']){
    users['demo@streambeat.app'] = { name: 'Demo Listener', email: 'demo@streambeat.app', pass: hashStr('demo123').toString(36), demo: true, created: Date.now() };
    saveUsers(users);
  }
  if(!store.get(dataKey('demo@streambeat.app'), null)){
    const d = defaultData();
    d.favorites = ['d2', 'd5', 'd8', 'd11'];
    d.saved = ['d1', 'd8'];
    d.following = [A1, A3, A6];
    d.recent = ['d8', 'd3', 'd1', 'd11', 'd5'];
    d.playlists = defaultPlaylistsFor();
    d.lyrics = Object.assign({}, DEMO_LYRICS);
    const rng = mulberry32(42);
    for(let i = 0; i < 14; i++){
      const k = dayKeyOffset(-i);
      d.stats.days[k] = { sec: Math.round(rng() * 4200), plays: Math.round(rng() * 9) };
    }
    d.stats.totalSec = Object.values(d.stats.days).reduce((a, x) => a + x.sec, 0);
    d.stats.totalPlays = 38;
    ['d1','d2','d5','d8','d11','d3'].forEach((id, i) => { d.stats.songs[id] = { plays: 9 - i, sec: (9 - i) * 210 }; });
    [A1, A3, A6, A4].forEach((a, i) => { d.stats.artists[a] = { plays: 12 - i * 2, sec: 0 }; });
    ['Pop', 'Lo-Fi', 'Electronic', 'Rock'].forEach((gr, i) => { d.stats.genres[gr] = { plays: 14 - i * 3, sec: 0 }; });
    store.set(dataKey('demo@streambeat.app'), d);
  }
}
function demoLogin(){
  seedDemo();
  const users = getUsers();
  enterApp(users['demo@streambeat.app']);
  toast('Welcome to the demo account ✨', 'ok');
}
function enterApp(user){
  S.user = user;
  S.data = getData(user.email);
  if(!S.data.playlists.length) S.data.playlists = defaultPlaylistsFor();
  setSession(user.email);
  $('authPage').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('smallName').textContent = user.name;
  $('smallEmail').textContent = user.email;
  $('smallAvatar').textContent = initials(user.name);
  S.npTab = 'lyrics';
  renderAll(); go('home');
  setTimeout(() => prewarmDemoAudio(['d1', 'd2', 'd3']), 4000);
}
function logout(){
  if(A.el) A.el.pause();
  setSession(null); S.user = null; S.data = null; S.currentId = null;
  $('app').classList.add('hidden');
  $('authPage').classList.remove('hidden');
  toast('Logged out — see you soon 👋');
}
/* ---------------- static wiring ---------------- */
function switchAuth(type){
  $('loginForm').classList.toggle('active', type === 'login');
  $('signupForm').classList.toggle('active', type === 'signup');
  $('loginTab').classList.toggle('active', type === 'login');
  $('signupTab').classList.toggle('active', type === 'signup');
  $('authMsg').textContent = '';
}
function wire(){
  // icons
  $$('[data-icon]').forEach(el => { el.innerHTML = I(el.dataset.icon, el.dataset.iconSize ? Number(el.dataset.iconSize) : 17); });
  setTheme(S.set.theme === 'dark' ? 'dark' : 'light');
  setAccent(S.set.accent, (ACCENTS.find(a => a.hex === S.set.accent) || ACCENTS[0]).rgb);
  S.visMode = S.set.vis || 'bars';
  const idleCover = genCover('StreamBeat', 'idle');
  $('playerCover').src = idleCover; $('npCover').src = idleCover;
  // nav
  $('nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-page]');
    if(b) go(b.dataset.page);
  });
  // auth tabs
  $('loginTab').onclick = () => switchAuth('login');
  $('signupTab').onclick = () => switchAuth('signup');
  $('demoLoginBtn').onclick = demoLogin;
  $('loginForm').onsubmit = e => {
    e.preventDefault();
    const email = $('loginEmail').value.trim().toLowerCase(), pass = $('loginPassword').value;
    const users = getUsers();
    if(!users[email] || users[email].pass !== hashStr(pass).toString(36)){ $('authMsg').textContent = 'Invalid email or password.'; return; }
    $('authMsg').textContent = '';
    enterApp(users[email]);
  };
  $('signupForm').onsubmit = e => {
    e.preventDefault();
    const name = $('signupName').value.trim(), email = $('signupEmail').value.trim().toLowerCase();
    const pass = $('signupPassword').value, conf = $('signupConfirm').value;
    const users = getUsers();
    if(!name || !email.includes('@')){ $('authMsg').textContent = 'Enter a name and a valid email.'; return; }
    if(pass.length < 6){ $('authMsg').textContent = 'Password must be at least 6 characters.'; return; }
    if(pass !== conf){ $('authMsg').textContent = 'Passwords do not match.'; return; }
    if(users[email]){ $('authMsg').textContent = 'Account already exists.'; return; }
    users[email] = { name, email, pass: hashStr(pass).toString(36), created: Date.now() };
    saveUsers(users);
    const d = defaultData(); d.playlists = defaultPlaylistsFor();
    store.set(dataKey(email), d);
    enterApp(users[email]);
    toast('Account created — welcome to StreamBeat 🎉', 'ok');
  };
  $('signupPassword').oninput = e => {
    const v = e.target.value, score = [v.length >= 6, v.length >= 10, /[0-9]/.test(v) && /[a-zA-Z]/.test(v), /[^a-zA-Z0-9]/.test(v)].filter(Boolean).length;
    $$('#pwStrength i').forEach((el, i) => { el.className = i < score ? 'f' + Math.max(1, score) : ''; });
  };
  // dock
  $('playBtn').onclick = togglePlay;
  $('npPlay').onclick = togglePlay;
  $('nextBtn').onclick = () => nextSong(true);
  $('npNext').onclick = () => nextSong(true);
  $('prevBtn').onclick = prevSong;
  $('npPrev').onclick = prevSong;
  $('shuffleBtn').onclick = () => { S.shuffle = !S.shuffle; updatePlayerUI(); toast(S.shuffle ? 'Shuffle ON 🔀' : 'Shuffle OFF'); };
  $('npShuffle').onclick = () => { S.shuffle = !S.shuffle; updatePlayerUI(); };
  $('repeatBtn').onclick = () => { S.repeat = (S.repeat + 1) % 3; updatePlayerUI(); toast(['Repeat OFF', 'Repeat ALL 🔁', 'Repeat ONE 🔂'][S.repeat]); };
  $('npRepeat').onclick = () => { S.repeat = (S.repeat + 1) % 3; updatePlayerUI(); };
  $('playerFav').onclick = () => { if(S.currentId){ const i = S.data.favorites.indexOf(S.currentId); if(i >= 0) S.data.favorites.splice(i, 1); else S.data.favorites.push(S.currentId); saveData(); updatePlayerUI(); renderAll(); } };
  $('npFav').onclick = () => $('playerFav').click();
  const seek = inp => {
    inp.addEventListener('input', () => { paintRange(inp); if(A.el && A.el.duration) A.el.currentTime = A.el.duration * (Number(inp.value) / 1000); });
    inp.addEventListener('mousedown', () => seekDragging = true);
    inp.addEventListener('touchstart', () => seekDragging = true, { passive: true });
    ['mouseup', 'touchend', 'change'].forEach(ev => inp.addEventListener(ev, () => { setTimeout(() => seekDragging = false, 150); }));
  };
  seek($('progressBar')); seek($('npProgress'));
  [['seekTip', 'progressBar'], ['npSeekTip', 'npProgress']].forEach(([tip, bar]) => {
    const wrap = $(bar).parentElement;
    wrap.addEventListener('mousemove', e => {
      const r = wrap.getBoundingClientRect(), p = clamp((e.clientX - r.left) / r.width, 0, 1);
      const tip2 = $(tip); tip2.style.left = (p * 100) + '%';
      tip2.textContent = fmtTime((A.el && A.el.duration || 0) * p);
    });
  });
  $('volumeBar').value = Math.round(S.set.volume * 100); paintRange($('volumeBar'));
  $('volumeBar').oninput = e => setVolume(Number(e.target.value) / 100);
  let lastVol = S.set.volume;
  $('muteBtn').onclick = () => { if(S.set.volume > 0){ lastVol = S.set.volume; setVolume(0); } else setVolume(lastVol || .8); };
  $('eqBtn').onclick = openEq;
  $('queueBtn').onclick = () => { $('queuePanel').classList.toggle('open'); renderQueue(); };
  $('queueCloseBtn').onclick = () => $('queuePanel').classList.remove('open');
  $('queueClearBtn').onclick = () => queue.clear();
  $('sleepBtn').onclick = openSleep;
  $('speedBtn').onclick = () => {
    S.speedIdx = (S.speedIdx + 1) % SPEEDS.length;
    S.set.speed = SPEEDS[S.speedIdx]; saveSettings();
    if(A.el) A.el.playbackRate = S.set.speed;
    toast('Speed: ' + S.set.speed + '×'); updatePlayerUI();
  };
  $('npExpand').onclick = () => { $('np').classList.add('show'); S.npTab = 'lyrics'; renderNpPanel(); kickVis(); };
  $('npClose').onclick = () => $('np').classList.remove('show');
  $('npLyricsEdit').onclick = () => S.currentId && openLyrics(S.currentId);
  $('npShare').onclick = () => S.currentId && shareCard(S.currentId);
  $('npVisMode').onclick = () => { S.visMode = VIS_MODES[(VIS_MODES.indexOf(S.visMode) + 1) % VIS_MODES.length]; $('npVisLabel').textContent = VIS_LABELS[S.visMode]; };
  [['tabLyrics', 'lyrics'], ['tabQueue', 'queue'], ['tabInfo', 'info']].forEach(([id, tab]) => {
    $(id).onclick = () => { S.npTab = tab; ['tabLyrics', 'tabQueue', 'tabInfo'].forEach(x => $(x).classList.toggle('active', x === id)); renderNpPanel(); };
  });
  $('themeBtn').onclick = () => setTheme(S.set.theme === 'dark' ? 'light' : 'dark');
  $('settingsBtn').onclick = openSettings;
  $('notifyBtn').onclick = openNotifications;
  $('uploadBtn').onclick = openUpload;
  $('miniProfile').onclick = () => go('profile');
  $('logoutBtn').onclick = logout;
  $('modalClose').onclick = closeModal;
  $('modal').onclick = e => { if(e.target === $('modal')) closeModal(); };
  // search
  const si = $('searchInput');
  si.addEventListener('input', debounce(() => doSearch(si.value), 140));
  si.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const v = si.value.trim(); closeSearch(); si.blur();
      S.browse = { q: v, genre: 'all', sort: 'title' }; go('browse');
    }
    if(e.key === 'Escape'){ si.value = ''; closeSearch(); si.blur(); }
  });
  document.addEventListener('click', e => { if(!e.target.closest('.search')) closeSearch(); });
  // keyboard
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toUpperCase();
    const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
    if(e.key === 'Escape'){
      if($('modal').classList.contains('show')) closeModal();
      else if($('queuePanel').classList.contains('open')) $('queuePanel').classList.remove('open');
      else if($('np').classList.contains('show')) $('np').classList.remove('show');
      return;
    }
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('app') || $('app').classList.contains('hidden')) return;
    const k = e.key.toLowerCase();
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if(e.key === 'ArrowRight' && A.el){ A.el.currentTime = Math.min(A.el.duration || 0, A.el.currentTime + 5); }
    else if(e.key === 'ArrowLeft' && A.el){ A.el.currentTime = Math.max(0, A.el.currentTime - 5); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setVolume(S.set.volume + .05); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); setVolume(S.set.volume - .05); }
    else if(k === 'm'){ $('muteBtn').click(); }
    else if(k === 'n'){ nextSong(true); }
    else if(k === 'p'){ prevSong(); }
    else if(k === 's'){ $('shuffleBtn').click(); }
    else if(k === 'r'){ $('repeatBtn').click(); }
    else if(k === 'l'){ $('playerFav').click(); }
    else if(k === 'f'){ $('np').classList.toggle('show'); if($('np').classList.contains('show')){ S.npTab = 'lyrics'; renderNpPanel(); kickVis(); } }
    else if(k === 'q'){ $('queuePanel').classList.toggle('open'); renderQueue(); }
    else if(k === 'e'){ $('modal').classList.contains('show') ? closeModal() : openEq(); }
    else if(k === '/'){ e.preventDefault(); si.focus(); }
    else if(k === '?'){ openShortcuts(); }
  });
  // visibility: keep visualizer honest
  document.addEventListener('visibilitychange', () => { if(!document.hidden && visActive()) kickVis(); });
}
/* ---------------- boot ---------------- */
function boot(){
  wireAudio();
  wire();
  seedDemo();
  window.__sbAudio = A.el;
  window.SB = { playSong, togglePlay, nextSong, prevSong, go, get current(){ return S.currentId; }, get state(){ return A.el ? A.el.paused : true; } };
  const sess = getSession(), users = getUsers();
  if(sess && users[sess]) enterApp(users[sess]);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
